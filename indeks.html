<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Peta Saya</title>

https://unpkg.com/leaflet@1.9.4/dist/leaflet.css

<style>
body{
margin:0;
}

#map{
width:100%;
height:100vh;
}
</style>

</head>
<body>

<div id="map"></div>

https://unpkg.com/leaflet@1.9.4/dist/leaflet.jsscript>

<script>

var map=L.map('map').setView([-6.2,106.816],10);

L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png'
).addTo(map);

fetch("lokasi.geojson")
.then(response=>response.json())
.then(data=>{

L.geoJSON(data).addTo(map);

});

</script>

</body>
</html>

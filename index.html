<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Peta Saya</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1>
html,body{
margin:0;
height:100%;
}

#map{
height:100vh;
width:100%;
}
</style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com4/dist/leaflet.jsscript>

<script>

var map = L.map('map');

L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
{
attribution:'© OpenStreetMap'
}
).addTo(map);

fetch('lokasi.geojson')
.then(response => response.json())
.then(data => {

var geojsonLayer = L.geoJSON(data, {

onEachFeature: function(feature, layer){

if(feature.properties){

let nama =
feature.properties.name ||
feature.properties.Name ||
feature.properties.nama ||
"Lokasi";

layer.bindPopup(nama);

}

}

}).addTo(map);

map.fitBounds(geojsonLayer.getBounds());

});

</script>

</body>
</html>

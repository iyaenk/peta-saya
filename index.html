var map = L.map('map');

L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
{
  attribution: '&copy; OpenStreetMap'
}
).addTo(map);

fetch('lokasi.geojson')
.then(response => response.json())
.then(data => {

    var layer = L.geoJSON(data).addTo(map);

    map.fitBounds(layer.getBounds());

});

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Peta Saya</title>

https://unpkg.com/leaflet@1.9.4/dist/leaflet.css

<style>
html,body{
margin:0;
height:100%;
}

#map{
height:100vh;
width:100%;
}
</style>
</head>

<body>

<div id="map"></div>

https://unpkg.com/leaflet@1.9.4/dist/leaflet.jsscript>

<script>

var map = L.map('map');

L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
{
attribution: '© OpenStreetMap'
}
).addTo(map);

fetch('lokasi.geojson')
.then(response => response.json())
.then(data => {

var layer = L.geoJSON(data).addTo(map);

map.fitBounds(layer.getBounds());

})
.catch(error => {
console.log(error);
alert("Gagal membaca lokasi.geojson");
});

</script>

</body>
</html>
